upstream cozy_web {
    server web:5000;
}

server {
    listen 80;
    server_name _;

    # максимальный размер загружаемого файла (совпадает с MAX_CONTENT_LENGTH)
    client_max_body_size 5m;

    # статика отдаётся nginx напрямую, не доходя до Flask
    location /static/ {
        alias /app/static/;
        access_log off;
        expires 7d;
    }

    # всё остальное проксируем в Flask (waitress)
    location / {
        proxy_pass http://cozy_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
