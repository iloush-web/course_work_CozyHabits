# HTTP: ACME-проверка (продление серта) + редирект на HTTPS
server {
    listen 80;
    server_name cozyhabits.undo.it;

    # ACME-проверка Let's Encrypt (выпуск/продление сертификата)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name cozyhabits.undo.it;

    ssl_certificate     /etc/letsencrypt/live/cozyhabits.undo.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cozyhabits.undo.it/privkey.pem;

    # максимальный размер загружаемого файла (совпадает с MAX_CONTENT_LENGTH)
    client_max_body_size 5m;

    # статика отдаётся nginx напрямую, не доходя до Flask
    location /static/ {
        alias /app/static/;
        access_log off;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # всё остальное проксируем в Flask (waitress).
    # resolver — встроенный DNS Docker (127.0.0.11). Через переменную $upstream
    # nginx резолвит имя 'web' на каждый запрос, а не кэширует IP при старте.
    # Иначе после пересборки web (новый IP) nginx стучится по старому -> 502.
    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://web:5000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
